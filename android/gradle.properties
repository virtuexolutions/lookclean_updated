# JVM settings for Gradle
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Disable Gradle daemon to avoid Windows file-lock issues
org.gradle.daemon=false

# Enable parallel build (optional but safe)
org.gradle.parallel=true

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# React Native architectures
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Legacy packaging disabled (AGP 8.6+)
android.useLegacyPackaging=false

# App signing (update with your keystore info)
# MYAPP_UPLOAD_STORE_FILE=my-upload-key.keystore
# MYAPP_UPLOAD_KEY_ALIAS=my-key-alias
# MYAPP_UPLOAD_STORE_PASSWORD=12345678
# MYAPP_UPLOAD_KEY_PASSWORD=12345678

# New architecture / Fabric / TurboModules
newArchEnabled=false

# Hermes JS engine
hermesEnabled=true
